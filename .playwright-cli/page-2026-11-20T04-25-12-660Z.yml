      - article [ref=e66]:
        - generic [ref=e67]: 🧩
        - heading "双模式，一套内核" [level=2] [ref=e68]
        - paragraph [ref=e69]: 业务数据网格（Grid）与电子表格（Spreadsheet）共享选择、渲染、命令与编辑基础设施，却各自拥有贴合场景的数据模型。
      - article [ref=e72]:
        - generic [ref=e73]: ⚡
        - heading "为大数据而生" [level=2] [ref=e74]
        - paragraph [ref=e75]: 行高前缀和索引 + 虚拟滚动 + 脏矩形重绘 + 滚动位块搬移，10 万行滚动目标 60 FPS，1000 列横向虚拟滚动。
      - article [ref=e78]:
        - generic [ref=e79]: 🧮
        - heading "独立公式引擎" [level=2] [ref=e80]
        - paragraph [ref=e81]: 自研解析器、依赖图与增量调度，改 A1 只重算受影响节点；函数注册表支持内置与自定义函数，MIT 核心零第三方依赖。
      - article [ref=e84]:
        - generic [ref=e85]: 🇨🇳
        - heading "中文与 Excel 互操作" [level=2] [ref=e86]
        - paragraph [ref=e87]: 独立 IME 守卫正确处理 composition 全序列；TSV / HTML 剪贴板与 Excel、WPS 双向粘贴；XLSX 零依赖读写。
      - article [ref=e90]:
        - generic [ref=e91]: 🔌
        - heading "插件与扩展生态" [level=2] [ref=e92]
        - paragraph [ref=e93]: 8 类扩展点、插件目录与依赖拓扑、生命周期账本；自定义编辑器、渲染器、数据适配器均可注入，商业扩展与 MIT 核心边界清晰。
      - article [ref=e96]:
        - generic [ref=e97]: 📦
        - heading "跨框架、按需加载" [level=2] [ref=e98]
        - paragraph [ref=e99]: 原生 Web Component + Vue / React 适配层；Script / npm / Custom Element 三种集成方式；只装 Grid 不会拉入公式与 XLSX 代码。
    - generic [ref=e102]:
      - heading [level=2] [ref=e103]:
        - text: 为什么是 SheetX
        - 'link "Permalink to \"为什么是 SheetX {#why}\"" [ref=e104]':
          - /url: "#why"
          - text: "#"
      - paragraph [ref=e105]:
        - text: SheetX 的定位不是"再做一个 Univer"，而是：
        - strong [ref=e106]: 集成体验更简单、业务编辑体验更专业、中文支持更好、性能透明、授权更友好的 Web 表格引擎
        - text: 。
      - list [ref=e107]:
        - listitem [ref=e108]:
          - strong [ref=e109]: 纯前端
          - text: ：不内置后端、数据库、账户权限或强制云服务。数据通过 Data Adapter 回调与宿主系统交互。
        - listitem [ref=e110]:
          - strong [ref=e111]: MIT 核心开源
          - text: ：虚拟滚动、基础编辑、复制粘贴、撤销重做等基础能力全部在社区版且足够优秀；商业版卖的是高阶生产力与企业级能力。
        - listitem [ref=e112]:
          - strong [ref=e113]: 工程透明
          - text: ：渲染 benchmark、浏览器 E2E 与单测全部落盘为真实报告，不靠"感觉流畅"。
      - heading [level=2] [ref=e114]:
